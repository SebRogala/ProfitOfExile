<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Font EV recipes</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
<script src="data.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:var(--color-lab-bg)}
.ph{border:1px dashed var(--color-lab-text-muted);border-radius:4px;color:var(--color-lab-text-secondary);font-size:12px;display:flex;align-items:center;justify-content:center}
.disc{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:.8125rem;color:var(--color-lab-text-secondary)}
.disc:hover{color:var(--color-lab-text)}
.disc:focus-visible{outline:1px solid var(--color-lab-blue);outline-offset:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;align-items:start}
</style>
</helmet>
<div style="padding: 16px; display: flex; flex-direction: column; gap: 14px; color: var(--color-lab-text)">
  <div class="ph" style="height: 120px">Font EV table · 1/20 · 20/0 · 20/20 (unchanged)</div>

  <section aria-labelledby="rec-h" style="display: flex; flex-direction: column; gap: 8px">
    <button type="button" class="disc" id="rec-h" aria-expanded="true"><svg width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><path d="M1 3l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>Recipes</button>
    <div class="cards">
      <dc-import name="RecipeCard" recipe="exceptional" state="priced" hint-size="100%,230px"></dc-import>
      <dc-import name="RecipeCard" recipe="lens" state="priced" hint-size="100%,260px"></dc-import>
    </div>
  </section>

  <button type="button" class="disc" aria-expanded="false" style="align-self: flex-start"><svg width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><path d="M3 1l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>Pool Overview</button>
  <div class="ph" style="height: 60px">Pool Overview (unchanged)</div>

  <div style="border-top: 1px solid var(--color-lab-border); margin-top: 18px; padding-top: 14px; display: flex; flex-direction: column; gap: 10px">
    <div class="cap">States (board only)</div>
    <div class="cards">
      <div style="display: flex; flex-direction: column; gap: 6px"><span class="cap">exceptional · one price missing</span><dc-import name="RecipeCard" recipe="exceptional" state="missing" hint-size="100%,230px"></dc-import></div>
      <div style="display: flex; flex-direction: column; gap: 6px"><span class="cap">exceptional · loading</span><dc-import name="RecipeCard" recipe="exceptional" state="loading" hint-size="100%,230px"></dc-import></div>
      <div style="display: flex; flex-direction: column; gap: 6px"><span class="cap">lens · negative EV</span><dc-import name="RecipeCard" recipe="lens" state="negative" hint-size="100%,260px"></dc-import></div>
      <div style="display: flex; flex-direction: column; gap: 6px"><span class="cap">lens · lens price unknown</span><dc-import name="RecipeCard" recipe="lens" state="missing" hint-size="100%,260px"></dc-import></div>
      <div style="display: flex; flex-direction: column; gap: 6px"><span class="cap">lens · stale price</span><dc-import name="RecipeCard" recipe="lens" state="stale" hint-size="100%,260px"></dc-import></div>
      <div style="display: flex; flex-direction: column; gap: 6px"><span class="cap">lens · loading</span><dc-import name="RecipeCard" recipe="lens" state="loading" hint-size="100%,260px"></dc-import></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1024,"height":1400}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
