<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Font EV recipes prototype</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
<script src="data.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:var(--color-lab-bg)}
.disc{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:.8125rem;color:var(--color-lab-text-secondary)}
.disc:hover{color:var(--color-lab-text)}
.disc:focus-visible{outline:1px solid var(--color-lab-blue);outline-offset:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;align-items:start}
</style>
</helmet>
<div style="padding: 16px; display: flex; flex-direction: column; gap: 14px; color: var(--color-lab-text)">
  <section aria-labelledby="rec-h" style="display: flex; flex-direction: column; gap: 8px">
    <button type="button" class="disc" id="rec-h" aria-expanded="true"><svg width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><path d="M1 3l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>Recipes</button>
    <div class="cards">
      <dc-import name="RecipeCard" recipe="exceptional" state="{{xState}}" hint-size="100%,230px"></dc-import>
      <dc-import name="RecipeCard" recipe="lens" state="{{lState}}" hint-size="100%,260px"></dc-import>
    </div>
  </section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"exceptionalState":{"editor":"enum","options":["priced","loading","missing","stale"],"default":"priced"},"lensState":{"editor":"enum","options":["priced","loading","missing","stale","negative"],"default":"priced"},"$preview":{"width":1024,"height":360}}'>
class Component extends DCLogic {
  renderVals() { return { xState: this.props.exceptionalState ?? 'priced', lState: this.props.lensState ?? 'priced' }; }
}
</script>
</body>
</html>
