<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Top bar — divine rate</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
:root{
  /* desktop/src/tokens.css, copied verbatim — the only declaration site in the app */
  --bg:#1a1a2e;--surface:#16213e;--border:#0f3460;--text:#e0e0e0;--text-muted:#888;--accent:#e94560;--success:#4ade80;--warning:#fbbf24;
  --color-lab-bg:#0f1117;--color-lab-surface:#1a1d27;--color-lab-border:#2a2d37;--color-lab-text:#e4e4e7;
  --color-lab-text-secondary:#9ca3af;--color-lab-text-muted:#888;--color-lab-green:#22c55e;--color-lab-red:#ef4444;
  --color-lab-yellow:#eab308;--color-lab-blue:#3b82f6;--color-lab-cyan:#22d3ee;--color-lab-purple:#a855f7;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--text);font-size:14px;line-height:1.5}
a{color:var(--color-lab-blue)}a:hover{color:var(--color-lab-text)}
button,input{font-family:inherit}
button:focus-visible{outline:1px solid var(--color-lab-blue);outline-offset:-1px}
.mono{font-family:'Consolas','Monaco',monospace;font-weight:600}
.cap{font-size:.625rem;text-transform:uppercase;letter-spacing:.06em;color:var(--color-lab-text-secondary)}
.sub{font-size:.6875rem;color:var(--color-lab-text-secondary);line-height:1.3}
.gain{color:var(--color-lab-green);font-weight:700}
.gain.loss{color:var(--color-lab-red)}
.gain.flat{color:var(--color-lab-text-muted)}
.amber{color:var(--color-lab-yellow)}
/* App chrome — 1:1 with desktop/src/lib/components/TopBar.svelte + Sidebar.svelte (context only; unchanged except the rate chip and the Harvest nav entry) */
.app-shell{display:flex;flex-direction:column;min-height:100vh;background:var(--bg)}
.tb{height:36px;min-height:36px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 0 0 .75rem;overflow:hidden}
.tb-l,.tb-c{display:flex;align-items:center;gap:.5rem}
.tb-name{font-size:12px;font-weight:600;color:var(--text)}
.tb-dot{width:7px;height:7px;border-radius:50%;background:var(--text-muted);flex-shrink:0}
.tb-dot.on{background:var(--success)}
.tb-gear{all:unset;font-size:1rem;opacity:.6;line-height:1;cursor:pointer}
.tb-r{display:flex;align-items:center;gap:12px}
.tb-win{display:flex;align-items:stretch;height:36px}
.tb-win button{background:none;border:none;color:var(--text-muted);width:46px;height:36px;display:flex;align-items:center;justify-content:center;font-size:14px}
.rate{all:unset;cursor:help;display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--text);padding:2px 6px;border-radius:4px}
.rate:hover{background:rgba(255,255,255,.06)}
.rate.stale .n{color:var(--warning)}
.rate.none .n{color:var(--text-muted)}
.rate img{width:18px;height:18px;object-fit:contain}
.rate .n{font-family:'Consolas','Monaco',monospace;font-weight:600}
.app-body{display:flex;flex:1;min-height:0}
.sb{width:180px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;justify-content:space-between}
.sb-top{flex:1;padding:10px 8px}
.sb-sec{margin-bottom:16px}
.sb-label{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);padding:0 10px;margin-bottom:4px}
.sb-ico{flex-shrink:0;width:16px;text-align:center}
.sb-lab{width:18px;height:14px;object-fit:contain;flex-shrink:0}
.sb-beta{margin-left:auto;font-size:.6rem;text-transform:uppercase;letter-spacing:.05em;border-radius:3px;border:1px solid currentcolor;padding:0 4px;white-space:nowrap;color:var(--color-lab-yellow)}
.sb-bottom{border-top:1px solid var(--border);padding:8px}
.sb-bottom .sb-label{margin-bottom:6px}
.sb-row{display:flex;justify-content:space-between;align-items:center;background:var(--bg);padding:4px 8px;margin-bottom:3px;border-radius:4px;font-size:11px;width:100%;border:none;color:var(--text);cursor:pointer;box-sizing:border-box}
.sb-row.group{font-weight:600;margin-top:4px;border-top:1px solid var(--border);padding-top:6px}
.sb-row.indent{padding-left:16px;font-size:10px}
.mode{font-size:10px}.mode.off{color:var(--text-muted)}.mode.always{color:var(--success)}.mode.auto{color:var(--warning)}.mode.nodata{color:var(--accent)}
.sb-collapse{background:none;border:none;border-top:1px solid var(--border);color:var(--text-muted);font-size:12px;padding:6px;width:100%;cursor:pointer}
.nav-item{all:unset;display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:12px;border-radius:5px;color:var(--text);cursor:pointer;box-sizing:border-box;width:100%}
.nav-item.active{background:var(--border);color:var(--accent)}
.seg{display:flex;border:1px solid var(--color-lab-border);border-radius:4px;overflow:hidden}
.seg button{background:transparent;border:none;color:var(--color-lab-text-secondary);padding:4px 10px;font-size:.6875rem;font-weight:600;cursor:pointer}
.seg button:hover{color:var(--color-lab-text);background:rgba(255,255,255,.05)}
.seg button.on{color:var(--color-lab-text);background:rgba(99,102,241,.2)}
.tab{background:transparent;border:none;border-bottom:2px solid transparent;color:var(--color-lab-text-secondary);padding:8px 12px;font-size:.75rem;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.tab:hover{color:var(--color-lab-text)}
.tab.on{color:var(--color-lab-text);border-bottom-color:var(--color-lab-blue)}
.tab .pending{font-size:.5625rem;text-transform:uppercase;letter-spacing:.06em;color:var(--color-lab-text-muted);border:1px solid var(--color-lab-border);padding:1px 4px;border-radius:3px}
.panel{background:var(--color-lab-surface);border:1px solid var(--color-lab-border)}
.col-h{display:flex;align-items:baseline;gap:8px;padding:10px 12px 8px;border-bottom:1px solid var(--color-lab-border)}
.tier{border-bottom:1px solid var(--color-lab-border);padding:8px 12px 10px;display:flex;flex-direction:column;gap:6px}
.tier:last-child{border-bottom:none}
.tier-h{display:flex;align-items:center;gap:8px}
.tier-name{font-size:.6875rem;font-weight:700;letter-spacing:.06em;color:var(--color-lab-text)}
.mixed{font-size:.5625rem;text-transform:uppercase;letter-spacing:.06em;color:var(--color-lab-yellow);border:1px solid color-mix(in srgb,var(--color-lab-yellow) 45%,transparent);border-radius:3px;padding:1px 4px}
.move{all:unset;cursor:pointer;font-size:.6875rem;color:var(--color-lab-text-secondary);border:1px solid var(--color-lab-border);border-radius:4px;padding:2px 8px;white-space:nowrap}
.move:hover{color:var(--color-lab-text);border-color:var(--color-lab-text-secondary)}
.move:focus-visible{outline:1px solid var(--color-lab-blue)}
.types{display:flex;flex-wrap:wrap;gap:4px}
.t{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:2px 8px 2px 4px;border-radius:3px;font-size:.75rem;border:1px solid var(--color-lab-border);background:var(--color-lab-bg)}
.t:hover{border-color:var(--color-lab-text-secondary)}
.t:focus-visible{outline:1px solid var(--color-lab-blue)}
.t.k{border-color:color-mix(in srgb,var(--color-lab-green) 40%,transparent);background:color-mix(in srgb,var(--color-lab-green) 10%,transparent)}
.t.forced{border-style:dashed;border-color:var(--color-lab-yellow)}
.t .p{color:var(--color-lab-text-secondary);font-family:'Consolas','Monaco',monospace;font-weight:600;font-size:.6875rem}
.rx{display:flex;flex-direction:column;gap:4px}
.rx-row{display:flex;gap:6px;align-items:stretch}
.rx input{flex:1;min-width:0;background:var(--color-lab-bg);border:1px solid var(--color-lab-border);color:var(--color-lab-text);padding:6px 8px;font-family:'Consolas','Monaco',monospace;font-size:.75rem}
.rx input:focus-visible{outline:1px solid var(--color-lab-blue)}
.btn{background:transparent;border:1px solid var(--border);color:var(--text-muted);padding:.2rem .6rem;border-radius:4px;font-size:.75rem;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--text)}
.lf{display:inline-flex;align-items:center;gap:4px;vertical-align:middle;white-space:nowrap}
.lf img{width:18px;height:18px;object-fit:contain}
.lf-name{color:var(--color-lab-text);font-weight:600}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:.75rem;color:var(--color-lab-text-secondary)}
.kv .mono{color:var(--color-lab-text)}
</style>
</helmet>
<div style="width: 1024px; background: var(--bg); padding-bottom: 120px">
<header class="tb">
  <div class="tb-l"><img src="/_blob/691f40d405f988c0569701be82d2a85b" alt="ProfitOfExile" width="26" height="26"><span class="tb-name">ProfitOfExile</span></div>
  <div class="tb-c">
    <span class="tb-dot on" title="Server: Connected"></span>
    <span class="tb-dot" title="OCR Scanner: Idle"></span>
    <button class="tb-gear" title="Settings">⚙️</button>
  </div>
  <div class="tb-r">
  <button class="{{rateCls}}" aria-describedby="rate-tip"><img src="/_blob/efa83dfa414d534823b4c06c8d93e252" alt="Divine Orb"><span class="n">1</span><span>=</span><span class="n">{{rateValue}}</span><img src="/_blob/78435a419710ac1cf980a8f964a9332b" alt="Chaos Orbs"><sc-if value="{{isStale}}" hint-placeholder-val="{{ false }}"><span style="font-size: .625rem; text-transform: uppercase; letter-spacing: .05em; color: var(--warning)">stale</span></sc-if></button>
  <div class="tb-win"><button title="Minimize">–</button><button title="Maximize">◻</button><button title="Close">✕</button></div>
  </div>
</header>
<div style="display: flex; justify-content: flex-end; padding: 6px 150px 0 0">
  <div id="rate-tip" role="tooltip" style="background: var(--color-lab-surface); border: 1px solid var(--color-lab-border); padding: 8px 12px; max-width: 400px; font-size: .75rem; line-height: 1.5; color: var(--color-lab-text); box-shadow: 0 8px 32px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.08)">
    <div style="font-weight: 700">{{tipTitle}}</div>
    <div style="color: var(--color-lab-text-secondary)">{{tipLine}}</div>
    <div style="color: var(--color-lab-text-secondary)">Every chaos ↔ divine figure in the app uses this rate.</div>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["ready","cold","stale"],"default":"ready"},"$preview":{"width":1024,"height":220}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.props.state ?? 'ready';
    if (st === 'cold') return { rateCls: 'rate none', rateValue: '—', isStale: false, tipTitle: 'No divine rate yet', tipLine: 'Waiting for the first Currency Exchange hour.' };
    if (st === 'stale') return { rateCls: 'rate stale', rateValue: '360', isStale: true, tipTitle: '1 divine = 360.1 chaos (stale)', tipLine: 'Last known rate from 21:00; server unreachable since 21:04.' };
    return { rateCls: 'rate', rateValue: '360', isStale: false, tipTitle: '1 divine = 360.1 chaos', tipLine: 'Currency Exchange, hour of 09 Sep 23:00 · updated 6 min ago' };
  }
}
</script>
</body>
</html>
