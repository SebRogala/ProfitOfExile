<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Boss loot confirmation · list</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
<script src="data.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.row{display:grid;grid-template-columns:16px 26px minmax(0,1fr) 40px 44px 40px;align-items:center;gap:8px;width:100%;padding:3px 6px;border:1px solid transparent;border-radius:4px;background:transparent;color:var(--color-lab-text);text-align:left;cursor:pointer;font-size:12px;min-height:34px}
.row:hover{background:rgba(255,255,255,.05)}
.row.on{background:rgba(59,130,246,.12);border-color:var(--color-lab-blue)}
.row.off .ic{opacity:.45}
.row.nc{cursor:default}
.ic{width:26px;height:26px;object-fit:contain}
.ph{width:26px;height:26px;display:flex;align-items:center;justify-content:center;border:1px dashed var(--color-lab-text-muted);border-radius:3px;font-size:9px;color:var(--color-lab-text-secondary)}
.nm{display:flex;flex-direction:column;min-width:0;line-height:14px}
.nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{font-size:11px;color:var(--color-lab-text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{font-family:'Consolas','Monaco',monospace;font-weight:600;text-align:right}
.prov{font-size:11px;color:var(--color-lab-text-secondary);text-align:right}
.wk{font-size:11px;color:var(--color-lab-text-secondary);text-align:right}
.ctl{width:14px;height:14px;border:1.5px solid var(--color-lab-text-secondary);display:flex;align-items:center;justify-content:center}
.ctl.radio{border-radius:50%}
.ctl.box{border-radius:3px}
.ctl.on{border-color:var(--color-lab-blue);background:var(--color-lab-blue)}
.ctl.dis{border-style:dashed;border-color:var(--color-lab-text-muted)}
.hdr{display:grid;grid-template-columns:16px 26px minmax(0,1fr) 40px 44px 40px;gap:8px;padding:0 7px 2px;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--color-lab-text-secondary)}
.hdr span{text-align:right}
</style>
</helmet>
<div class="game" style="width: 600px; height: 800px; padding: 20px; display: flex; justify-content: flex-end; align-items: flex-start">
  <span class="game-tag">[game, 1080p] · panel at its saved position</span>
  <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
    <button type="button" class="btn" onClick="{{replay}}" style="position: absolute; left: 20px; top: 20px">Replay capture</button>
  </sc-if>

  <section class="ov" aria-label="Boss loot confirmation" style="width: 400px; position: relative; z-index: 1">
    <div class="ov-head">
      <div>
        <div class="ov-title">{{bossShort}} · run {{run}}</div>
        <div class="ov-why">Zone <span class="mono" style="font-weight: 400">{{area}}</span>, level {{level}}</div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px">
        <sc-if value="{{counting}}" hint-placeholder-val="{{ true }}"><span class="badge badge-blue">Saving in <b class="mono">{{secs}}</b> s</span></sc-if>
        <sc-if value="{{paused}}" hint-placeholder-val="{{ false }}"><span class="badge badge-yellow">Paused: pick one unique</span></sc-if>
        <sc-if value="{{savedB}}" hint-placeholder-val="{{ false }}"><span class="badge badge-green">Saved · run {{run}}</span></sc-if>
        <sc-if value="{{discB}}" hint-placeholder-val="{{ false }}"><span class="badge badge-grey">Discarded</span></sc-if>
        <span class="segmented" role="group" aria-label="Whose data">
          <button type="button" class="segmented-btn {{ownCls}}" aria-pressed="{{isOwn}}" onClick="{{pickOwn}}">Own</button>
          <button type="button" class="segmented-btn {{colCls}}" aria-pressed="{{isCol}}" onClick="{{pickCol}}">Collective</button>
        </span>
      </div>
    </div>
    <div class="cd"><i style="width: {{barW}}"></i></div>

    <div class="ov-sec" style="padding-left: 6px; padding-right: 6px">
      <div class="grp" style="padding: 0 6px"><span>Unique pool · one per kill</span><span class="grp-note {{poolCls}}">{{poolMsg}}</span></div>
      <div class="hdr" aria-hidden="true"><i></i><i></i><i></i><span>{{whoLabel}}</span><span>drops</span><span>wiki</span></div>
      <div role="radiogroup" aria-label="Unique pool" style="display: flex; flex-direction: column; gap: 2px">
        <sc-for list="{{pool}}" as="t" hint-placeholder-count="6">
          <button type="button" role="radio" aria-checked="{{t.on}}" class="row {{t.cls}}" onClick="{{t.toggle}}">
            <span class="ctl radio {{t.ctlCls}}"><sc-if value="{{t.on}}" hint-placeholder-val="{{ false }}"><svg width="6" height="6" viewBox="0 0 6 6" aria-hidden="true"><circle cx="3" cy="3" r="3" fill="var(--color-lab-bg)"/></svg></sc-if></span>
            <img class="ic" src="{{t.src}}" alt="">
            <span class="nm"><span>{{t.name}}</span><small>{{t.sub}}</small></span>
            <span class="num">{{t.rate}}</span>
            <span class="prov">{{t.prov}}</span>
            <span class="wk">{{t.wiki}}</span>
          </button>
        </sc-for>
      </div>
    </div>

    <div class="ov-sec" style="padding-left: 6px; padding-right: 6px">
      <div class="grp" style="padding: 0 6px"><span>Additional drops</span><span class="grp-note sec">{{extraMsg}}</span></div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <sc-for list="{{extra}}" as="t" hint-placeholder-count="8">
          <button type="button" aria-pressed="{{t.on}}" aria-disabled="{{t.notCounted}}" class="row {{t.cls}}" onClick="{{t.toggle}}" title="{{t.title}}">
            <span class="ctl box {{t.ctlCls}}"><sc-if value="{{t.on}}" hint-placeholder-val="{{ false }}"><svg width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 5.2 4 7.6 8.6 2.4" fill="none" stroke="var(--color-lab-bg)" stroke-width="2"/></svg></sc-if></span>
            <sc-if value="{{t.hasArt}}" hint-placeholder-val="{{ true }}"><img class="ic" src="{{t.src}}" alt=""></sc-if>
            <sc-if value="{{t.noArt}}" hint-placeholder-val="{{ false }}"><span class="ph">rare</span></sc-if>
            <span class="nm"><span>{{t.name}}</span><small>{{t.sub}}</small></span>
            <sc-if value="{{t.notCounted}}" hint-placeholder-val="{{ false }}"><span class="badge badge-yellow" style="grid-column: span 2; justify-self: end">not counted</span></sc-if>
            <sc-if value="{{t.counted}}" hint-placeholder-val="{{ true }}"><span class="num">{{t.rate}}</span></sc-if>
            <sc-if value="{{t.counted}}" hint-placeholder-val="{{ true }}"><span class="prov">{{t.prov}}</span></sc-if>
            <span class="wk">{{t.wiki}}</span>
          </button>
        </sc-for>
      </div>
    </div>

    <div class="ov-sec" style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
      <span class="sec" style="font-size: 11px">Not in table: <span style="color: var(--color-lab-text)">{{unknown}}</span></span>
      <span style="display: flex; gap: 6px">
        <button type="button" class="btn btn-ghost" onClick="{{discard}}">Discard</button>
        <button type="button" class="btn btn-primary" onClick="{{save}}">{{saveLabel}}</button>
      </span>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"timeout":{"editor":"int","default":10,"min":3,"max":60,"unit":"s"},"$preview":{"width":600,"height":800}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = this.fresh(); }
  fresh() {
    var D = window.POE317, t = (this.props && this.props.timeout) || 10;
    var ex = {}; D.capture.matched.forEach(function (id) { ex[id] = true; });
    return { pick: 'urn', ex: ex, secs: t, mode: 'own', done: false, discarded: false };
  }
  componentDidMount() {
    var self = this;
    this.iv = setInterval(function () {
      var s = self.state;
      if (s.done || !s.pick) return;
      if (s.secs <= 1) self.setState({ secs: 0, done: true }); else self.setState({ secs: s.secs - 1 });
    }, 1000);
  }
  componentWillUnmount() { clearInterval(this.iv); }
  touch(patch) { var t = this.props.timeout ?? 10; this.setState(Object.assign({ secs: t }, patch)); }
  renderVals() {
    var D = window.POE317, s = this.state, self = this, t = this.props.timeout ?? 10;
    var read = {}; D.capture.matched.forEach(function (id) { read[id] = true; });
    var pool = D.pool.map(function (x) {
      var on = s.pick === x.id;
      return Object.assign({}, x, { on: on, cls: on ? 'on' : 'off', ctlCls: on ? 'on' : '',
        sub: x.base + (read[x.id] ? ' · read' : ''),
        toggle: function () { if (!s.done) self.touch({ pick: on ? null : x.id }); } });
    });
    var extra = D.extra.map(function (x) {
      var on = !!s.ex[x.id] && !x.notCounted;
      return Object.assign({}, x, { on: on, hasArt: !!x.src, noArt: !x.src,
        counted: !x.notCounted, notCounted: !!x.notCounted,
        sub: x.notCounted ? 'your loot filter hides it' : (x.manual ? 'tick by hand: OCR cannot see veiled mods' : x.base + (read[x.id] ? ' · read' : '')),
        rate: s.mode === 'col' && x.drops === 0 ? '—' : x.rate,
        cls: x.notCounted ? 'nc off' : (on ? 'on' : 'off'),
        ctlCls: x.notCounted ? 'dis' : (on ? 'on' : ''),
        title: x.notCounted ? 'Not counted: change on the Boss loot page' : x.name,
        toggle: function () { if (s.done || x.notCounted) return; var e = Object.assign({}, s.ex); e[x.id] = !e[x.id]; self.touch({ ex: e }); } });
    });
    var nEx = extra.filter(function (x) { return x.on; }).length;
    return {
      bossShort: D.boss.short, run: D.capture.run, area: D.boss.area, level: D.boss.level,
      n: D.boss.runs, whoLabel: s.mode === 'col' ? 'all' : 'own',
      secs: s.secs, counting: !s.done && !!s.pick, paused: !s.done && !s.pick, done: s.done,
      savedB: s.done && !s.discarded, discB: s.discarded,
      barW: (s.done ? 0 : Math.round((s.secs / t) * 100)) + '%',
      isOwn: s.mode === 'own', isCol: s.mode === 'col', ownCls: s.mode === 'own' ? 'active' : '', colCls: s.mode === 'col' ? 'active' : '',
      pickOwn: function () { self.touch({ mode: 'own' }); }, pickCol: function () { self.touch({ mode: 'col' }); },
      pool: pool, poolMsg: s.pick ? '1 picked' : 'none picked', poolCls: s.pick ? 'ok' : 'warn',
      extra: extra, extraMsg: nEx + ' ticked',
      unknown: D.capture.unknown.join(', '),
      saveLabel: s.done ? 'Saved' : 'Save now',
      save: function () { if (s.pick) self.setState({ done: true, secs: 0 }); },
      discard: function () { self.setState({ done: true, discarded: true, secs: 0 }); },
      replay: function () { self.setState(self.fresh()); }
    };
  }
}
</script>
</body>
</html>
