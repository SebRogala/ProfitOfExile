name: Quality

# Path-filtered so a docs-only push (or a desktop-only change) does not spin
# up docker builds, the -race suite and a throwaway TimescaleDB for nothing.
# The desktop jobs live in desktop-quality.yml with their own desktop/**
# filter. Whitelist trade-off is the same one deploy.yml already accepts: a
# new file class that affects these jobs must be added here.
on:
  pull_request:
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'frontend/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'internal/**'
      - 'cmd/**'
      - 'db/**'
      - 'scripts/**'
      - 'Makefile'
      - '.github/workflows/quality.yml'
  push:
    branches: [main]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'frontend/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'internal/**'
      - 'cmd/**'
      - 'db/**'
      - 'scripts/**'
      - 'Makefile'
      - '.github/workflows/quality.yml'

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Compose network
        run: docker network create infra
      - name: Build backend image
        run: docker compose build app
      - name: Go tests with race detector
        run: docker compose run --rm app go test -race ./...

  # Its own job rather than steps appended to `backend` so a formatting nit and
  # a test failure stay separately readable — appended steps report only
  # whichever fails first. Runs in the compose image, not actions/setup-go, so
  # gofmt is byte-identical to the toolchain the tests and the production build
  # use; a setup-go patch release that formats differently would red this gate
  # for a reason nobody could reproduce locally.
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Compose network
        run: docker network create infra
      - name: Build backend image
        run: docker compose build app
      # gofmt exits 0 whether or not it printed anything, so the exit status is
      # useless as a gate — the file list is the signal and has to be turned
      # into one explicitly.
      #
      # Captured into a variable rather than piped into `tee`: the runner's
      # default shell is `bash -e` without pipefail, so in a pipeline a failed
      # `docker compose run` would surface as tee's exit 0 with an empty list —
      # a broken gate that reports green. An assignment takes the substitution's
      # exit status, so `set -e` catches it.
      - name: gofmt
        run: |
          unformatted="$(docker compose run --rm -T app gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            echo "::error::gofmt found unformatted files (listed above). Run: gofmt -w <file>" >&2
            exit 1
          fi
      # -tags integration as well as untagged: the integration-only files are
      # not part of the default build, so an untagged vet never type-checks
      # them. That is the same blind spot the backend-integration job exists to
      # close.
      - name: go vet
        run: |
          docker compose run --rm -T app go vet ./...
          docker compose run --rm -T app go vet -tags integration ./...

  # The `backend` job above runs without `-tags integration`, so every
  # //go:build integration file is neither compiled nor run there. This job is
  # the only place they execute — and the only place they are compiled, which is
  # why a stale integration test used to reach main green.
  #
  # Deliberately not a count: the previous wording named one ("the twelve") and
  # was wrong within a change set. How many there are is the script's business
  # anyway — scripts/integration-test.sh derives the inventory from the tree on
  # every run and fails if the names and the build tags disagree.
  backend-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Compose network
        run: docker network create infra

      # Container name, network, image and the virgin-database requirement are
      # documented in the script. deploy.yml's `validate` job calls the same one
      # so the deploy gate cannot drift from this one.
      - name: Start TimescaleDB
        run: ./scripts/ci-start-timescaledb.sh

      - name: Build backend image
        run: docker compose build app

      - name: Integration tests
        run: make test-integration

  # The icon cache filename scheme is implemented twice — Go
  # (internal/gemicon.filePath) and Python (scripts/download-gem-icons.py) — and
  # production reads only what the Python side writes, from a volume the server
  # may not refetch (ADR-012: poewiki 403s the VPS). So a scheme that drifts
  # between the two languages seeds files the server never looks for, and the
  # symptom is a 502 per icon with no way back except a re-crawl from an allowed
  # IP. The Go half of the vector is pinned by TestShortHash_pinnedVector in the
  # `backend` job; this is the Python half.
  #
  # The expected value is restated here rather than imported from the script, as
  # an independent oracle: the script's own import-time _self_check() asserts the
  # same vector, so a check that asked the script what it expected would go green
  # on a commit that changed the scheme and the self-check together — which is
  # exactly the change this gate exists to stop.
  #
  # No docker, no Go toolchain: ubuntu-latest ships python3, and the script
  # imports nothing outside the standard library.
  icon-cache-filename-scheme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # PYTHONDONTWRITEBYTECODE keeps the import from leaving __pycache__ in the
      # checkout; importing the module also runs its _self_check().
      - name: Python cache-filename vector
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          got="$(python3 -c "
          import importlib.util
          spec = importlib.util.spec_from_file_location('dl', 'scripts/download-gem-icons.py')
          m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          print(m.cache_file_name('Absolution','https://www.poewiki.net/images/c/c6/Absolution_inventory_icon.png'))
          ")"
          echo "$got"
          test "$got" = "Absolution-e2b9dfdb1dd1d6a0.png"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Compose network
        run: docker network create infra
      - name: Build frontend image
        run: docker compose build frontend
      - name: Install dependencies
        run: docker compose run --rm frontend npm ci
      - name: Svelte check
        # vite build does not typecheck — an undefined identifier (the
        # toStorePool outage) sails through it and dies at runtime in prod.
        run: docker compose run --rm frontend npm run check
      - name: Build frontend
        run: docker compose run --rm frontend npm run build
