name: Test & Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'frontend/**'
      - 'Dockerfile'
      - 'internal/**'
      - 'cmd/**'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      collector: ${{ steps.filter.outputs.collector }}
      go: ${{ steps.filter.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
            server:
              # The server binary imports across internal/ and go:embeds data
              # files there (e.g. internal/gemicon/gem-icon-urls.json), so any
              # internal/ change can change what it serves. Listing packages
              # individually silently skipped the deploy for gemicon, device,
              # league, mercure, price and trade — a green run that shipped
              # nothing. Over-deploying on a collector-only change is the safe
              # direction; under-deploying is not. See docs/DEPLOY.md.
              - 'internal/**'
              - 'cmd/server/**'
              - 'frontend/**'
              - 'go.mod'
              - 'go.sum'
              - 'Dockerfile'
            collector:
              # Matches `go list -deps ./cmd/collector`. Re-derive when the
              # collector gains an import; see docs/DEPLOY.md.
              - 'cmd/collector/**'
              - 'internal/collector/**'
              - 'internal/db/**'
              - 'internal/league/**'
              - 'internal/mercure/**'
              - 'internal/price/**'
              - 'go.mod'
              - 'go.sum'
              - 'Dockerfile'

  validate:
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.go == 'true'
      || needs.detect-changes.outputs.server == 'true'
      || needs.detect-changes.outputs.collector == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create Compose network
        run: docker network create infra || true

      # Same throwaway database quality.yml's `backend-integration` job uses;
      # the shared script is what keeps the deploy gate and the PR gate testing
      # against identical infrastructure.
      - name: Start TimescaleDB
        run: ./scripts/ci-start-timescaledb.sh

      # Unconditional, unlike the race-test step below: the integration suite
      # needs this image too, and it is the cheaper of the two costs here.
      - name: Build test image
        run: docker compose build app

      - name: Run Go tests with race detector
        if: needs.detect-changes.outputs.go == 'true'
        run: docker compose run --rm app go test -race ./...

      # Deliberately ungated, where the race-test step above keys on
      # `go == 'true'`. The `go` filter is `**/*.go` + go.mod/go.sum, so a
      # commit touching only internal/db/migrations/*.sql sets `server` (via
      # `internal/**`) without setting `go`: it reaches this job, deploys, and
      # would skip the one phase that tests migrations. The job's own `if:`
      # already restricts it to Go/server/collector changes, so no extra
      # condition is needed here — a frontend-only commit paying ~1-2 min for
      # the suite is the accepted price of never skipping a migration test.
      #
      # This step failing fails the job, and both deploy-server and
      # deploy-collector require `needs.validate.result == 'success'`, so a red
      # integration suite blocks the Coolify webhook rather than reporting
      # alongside a deploy that shipped anyway.
      - name: Run Go integration tests
        run: make test-integration

      - name: Build production server image
        if: needs.detect-changes.outputs.server == 'true'
        run: docker build --target server --build-arg GIT_SHA=${{ github.sha }} .

      - name: Build production collector image
        if: needs.detect-changes.outputs.collector == 'true'
        run: docker build --target collector --build-arg GIT_SHA=${{ github.sha }} .

  deploy-server:
    needs: [detect-changes, validate]
    if: |
      always()
      && needs.detect-changes.outputs.server == 'true'
      && needs.validate.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Coolify deploy (server)
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_UUID: ${{ secrets.COOLIFY_SERVER_UUID }}
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
        run: |
          curl -sf -X GET \
            "${COOLIFY_WEBHOOK_URL}/api/v1/deploy?uuid=${COOLIFY_UUID}&force=false" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}"

  deploy-collector:
    # Sequential after deploy-server: prod host has ~3.7GB RAM and two
    # concurrent Go builds (~2GB peak each) get OOM-killed at the linker
    # step. Wait for server deploy to settle before triggering collector.
    # If the commit only touched collector paths, deploy-server is skipped
    # and collector runs immediately.
    needs: [detect-changes, validate, deploy-server]
    if: |
      always()
      && needs.detect-changes.outputs.collector == 'true'
      && needs.validate.result == 'success'
      && (needs.deploy-server.result == 'success' || needs.deploy-server.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
      # GH Actions sequencing alone is not enough — the webhook returns in
      # ~1s and Coolify queues the deploy asynchronously. Sleep so the
      # server's Coolify-side build completes before we trigger collector's.
      - name: Stagger after server deploy
        if: needs.deploy-server.result == 'success'
        run: sleep 150

      - name: Trigger Coolify deploy (collector)
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_UUID: ${{ secrets.COOLIFY_COLLECTOR_UUID }}
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
        run: |
          curl -sf -X GET \
            "${COOLIFY_WEBHOOK_URL}/api/v1/deploy?uuid=${COOLIFY_UUID}&force=false" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}"
