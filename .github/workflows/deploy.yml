name: Test & Deploy

on:
  push:
    branches: [main]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'frontend/**'
      - 'Dockerfile'
      - 'internal/**'
      - 'cmd/**'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      collector: ${{ steps.filter.outputs.collector }}
      go: ${{ steps.filter.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
            server:
              - 'cmd/server/**'
              - 'internal/server/**'
              - 'internal/db/**'
              - 'internal/lab/**'
              - 'frontend/**'
              - 'go.mod'
              - 'go.sum'
              - 'Dockerfile'
            collector:
              - 'cmd/collector/**'
              - 'internal/collector/**'
              - 'internal/db/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'Dockerfile'

  validate:
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.go == 'true'
      || needs.detect-changes.outputs.server == 'true'
      || needs.detect-changes.outputs.collector == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create Compose network
        run: docker network create infra || true

      - name: Build test image
        if: needs.detect-changes.outputs.go == 'true'
        run: docker compose build app

      - name: Run Go tests with race detector
        if: needs.detect-changes.outputs.go == 'true'
        run: docker compose run --rm app go test -race ./...

      - name: Build production server image
        if: needs.detect-changes.outputs.server == 'true'
        run: docker build --target server --build-arg GIT_SHA=${{ github.sha }} .

      - name: Build production collector image
        if: needs.detect-changes.outputs.collector == 'true'
        run: docker build --target collector --build-arg GIT_SHA=${{ github.sha }} .

  deploy-server:
    needs: [detect-changes, validate]
    if: |
      always()
      && needs.detect-changes.outputs.server == 'true'
      && needs.validate.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Coolify deploy (server)
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_UUID: ${{ secrets.COOLIFY_SERVER_UUID }}
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
        run: |
          curl -sf -X GET \
            "${COOLIFY_WEBHOOK_URL}/api/v1/deploy?uuid=${COOLIFY_UUID}&force=false" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}"

  deploy-collector:
    # Sequential after deploy-server: prod host has ~3.7GB RAM and two
    # concurrent Go builds (~2GB peak each) get OOM-killed at the linker
    # step. Wait for server deploy to settle before triggering collector.
    # If the commit only touched collector paths, deploy-server is skipped
    # and collector runs immediately.
    needs: [detect-changes, validate, deploy-server]
    if: |
      always()
      && needs.detect-changes.outputs.collector == 'true'
      && needs.validate.result == 'success'
      && (needs.deploy-server.result == 'success' || needs.deploy-server.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
      # GH Actions sequencing alone is not enough — the webhook returns in
      # ~1s and Coolify queues the deploy asynchronously. Sleep so the
      # server's Coolify-side build completes before we trigger collector's.
      - name: Stagger after server deploy
        if: needs.deploy-server.result == 'success'
        run: sleep 150

      - name: Trigger Coolify deploy (collector)
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_UUID: ${{ secrets.COOLIFY_COLLECTOR_UUID }}
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
        run: |
          curl -sf -X GET \
            "${COOLIFY_WEBHOOK_URL}/api/v1/deploy?uuid=${COOLIFY_UUID}&force=false" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}"
