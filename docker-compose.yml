services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: profitofexile_app
    volumes:
      - .:/app
      - go-pkg:/root/go/pkg
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://profitofexile:profitofexile@postgres:5432/profitofexile}
      - PORT=8080
      - MERCURE_URL=${MERCURE_URL:-http://mercure/.well-known/mercure}
      - MERCURE_JWT_SECRET=${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      # Active league comes from runtime_config in the DB (league.Resolve), not env.
      # EXPECTED_LEAGUE is an optional deploy assertion: if set, the process refuses
      # readiness unless the resolved league matches exactly. Leave unset by default.
      # - EXPECTED_LEAGUE=Mirage
      - TRADE_ENABLED=${TRADE_ENABLED:-false}
      - TRADE_SYNC_WAIT=${TRADE_SYNC_WAIT:-15s}
      - MERCURE_SUBSCRIBER_KEY=${MERCURE_SUBSCRIBER_KEY:-!ChangeThisMercureHubJWTSecretKey!}
      - MERCURE_PUBLIC_URL=${MERCURE_PUBLIC_URL:-https://mercure.localhost/.well-known/mercure}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:1420,tauri://localhost}
    networks:
      - infra
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.profitofexile-api.rule=Host(`profitofexile.localhost`) && PathPrefix(`/api`)"
      - "traefik.http.routers.profitofexile-api.entrypoints=websecure"
      - "traefik.http.routers.profitofexile-api.tls=true"
      - "traefik.http.services.profitofexile-api.loadbalancer.server.port=8080"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: profitofexile_frontend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - infra
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.profitofexile-frontend.rule=Host(`profitofexile.localhost`)"
      - "traefik.http.routers.profitofexile-frontend.entrypoints=websecure"
      - "traefik.http.routers.profitofexile-frontend.tls=true"
      - "traefik.http.routers.profitofexile-frontend.priority=1"
      - "traefik.http.services.profitofexile-frontend.loadbalancer.server.port=5173"

  collector:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: profitofexile_collector
    volumes:
      - .:/app
      - go-pkg:/root/go/pkg
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://profitofexile:profitofexile@postgres:5432/profitofexile}
      - PORT=8090
      # Active league comes from runtime_config in the DB (league.Resolve), not env.
      # EXPECTED_LEAGUE is an optional deploy assertion (see server service above).
      # - EXPECTED_LEAGUE=Mirage
      # - NINJA_INTERVAL=15m       # deprecated (POE-22), use NINJA_FALLBACK_INTERVAL. Remove after v1.1.
      # - NINJA_FALLBACK_INTERVAL=30m
      # - NINJA_MAX_AGE=30m
      # - NINJA_MAX_RETRIES=5
      # - NINJA_MIN_SLEEP=30s
      # Currency exchange ingest (internal/exchange) — on by default; values shown are the defaults.
      # - EXCHANGE_INGEST_ENABLED=true
      # - EXCHANGE_TICK=5m
      # - EXCHANGE_PER_HOUR_DELAY=250ms
      - MERCURE_URL=${MERCURE_URL:-http://mercure/.well-known/mercure}
      - MERCURE_JWT_SECRET=${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      - SERVER_URL=${SERVER_URL:-http://app:8080}
    networks:
      - infra
    restart: unless-stopped
    command: ["air", "-c", ".air.collector.toml"]

  desktop:
    build:
      context: .
      dockerfile: Dockerfile.desktop
    container_name: profitofexile_desktop
    volumes:
      - ./desktop:/app/desktop
      # The merc signature parity golden (POE-207), for the same reason and by
      # the same rule: `crop.png` + `signature.bin` are the ONE artefact the Go
      # and Rust derivations of format 2 are both checked against, so there is
      # exactly one copy and both suites read it from its canonical path.
      # Writable (not `:ro`): the RUST side regenerates it
      # under `MERC_SIG_UPDATE=1` and does so from inside this container. Go
      # only ever reads it. Regenerating is a deliberate format change.
      - ./internal/mercenary/testdata/merc-sig-v2:/app/internal/mercenary/testdata/merc-sig-v2
      # The server's embedded gem-art name map (ADR-012), read-only and by the
      # same rule again (POE-208): `mercenary/seed-map.json` may only name gems
      # `/api/gem-icon/{name}` will answer for, and the contract test reads the
      # SERVER's copy rather than a mirror — a mirror would only ever prove it
      # agreed with itself, and a name the server dropped would 404 forever.
      - ./internal/gemicon/gem-icon-urls.json:/app/internal/gemicon/gem-icon-urls.json:ro
      - desktop_cargo_registry:/usr/local/cargo/registry
      - desktop_cargo_git:/usr/local/cargo/git
      - desktop_target:/app/desktop/src-tauri/target
      - desktop_node_modules:/app/desktop/node_modules

volumes:
  go-pkg:
  frontend_node_modules:
  desktop_cargo_registry:
  desktop_cargo_git:
  desktop_target:
  desktop_node_modules:

networks:
  infra:
    external: true
