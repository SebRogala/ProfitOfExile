[package]
name = "profitofexile-desktop"
version = "0.8.1-beta.5"
edition = "2021"

[[bin]]
name = "ProfitOfExile"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
notify = "6"
strsim = "0.11"
reqwest = { version = "0.12", features = ["json"] }
log = "0.4"
env_logger = "0.11"
rand = "0.8"
image = "0.25"
anyhow = "1"
rfd = "0.15"
sysinfo = "0.33"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
# Only for RFC3339-formatting the updater manifest's pub_date in
# `updater_channel`; `tauri-plugin-updater` hands that field over as a
# `time::OffsetDateTime`, so the same crate has to do the formatting.
time = { version = "0.3", features = ["formatting"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.58", features = [
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    "Globalization",
    "Foundation",
    "Foundation_Collections",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Foundation",
    # MonitorFromWindow / GetMonitorInfoW — the focus poller resolves which
    # display the game window is on so capture follows it (POE-237).
    "Win32_Graphics_Gdi",
] }
xcap = "0.0.13"

# Dev profile, measured on the PC 2026-09-07 under `npx tauri dev` with a
# one-line change in temple/run.rs: this crate at opt-level 1 rebuilt in 70 s,
# at 0 in 16 s; a from-scratch crate build took ~4 min at 1 and 87 s at 0. So
# this crate stays at the default 0, and the pixel loops that live here (the
# anchor correlation, the OCR crop prep) run unoptimized in dev: an
# all-unoptimized dev build measured a full temple read at 4247 ms against
# 666 ms on release (2026-09-06). Timing questions go to the release exe
# (`make desktop-release-windows`, docs/DEV-SETUP.md "Quick rebuilds").
# Dependencies at opt-level 3: compiled once (~7.5 min for all 424 of them,
# paid again only after `cargo clean` or a dependency bump), never part of an
# incremental rebuild, and the capture/image crates run at release speed.
[profile.dev.package."*"]
opt-level = 3
