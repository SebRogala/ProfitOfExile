[package]
name = "profitofexile-desktop"
version = "0.8.1-beta.3"
edition = "2021"

[[bin]]
name = "ProfitOfExile"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
notify = "6"
strsim = "0.11"
reqwest = { version = "0.12", features = ["json"] }
log = "0.4"
env_logger = "0.11"
rand = "0.8"
image = "0.25"
anyhow = "1"
rfd = "0.15"
sysinfo = "0.33"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
# Only for RFC3339-formatting the updater manifest's pub_date in
# `updater_channel`; `tauri-plugin-updater` hands that field over as a
# `time::OffsetDateTime`, so the same crate has to do the formatting.
time = { version = "0.3", features = ["formatting"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.58", features = [
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    "Globalization",
    "Foundation",
    "Foundation_Collections",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Foundation",
    # MonitorFromWindow / GetMonitorInfoW — the focus poller resolves which
    # display the game window is on so capture follows it (POE-237).
    "Win32_Graphics_Gdi",
] }
xcap = "0.0.13"

# Dev profile: the app's hot loops (screen-capture conversion, the anchor
# correlation, the OCR crop/bitmap prep) are pixel loops, and an unoptimized
# build runs them 10-20x slower than release — measured 2026-09-06 on the PC:
# a full temple read took 4247 ms on `tauri dev` and 666 ms on release, the
# same code. Dependencies at opt-level 3 (their cost is compiled once), this
# crate at 1 so incremental rebuilds stay quick. Judge it from app.log's
# `Temple: read timings` line; if `cheap detect` / `anchor` are still an order
# of magnitude off release, raise the crate to 2. The release profile is
# untouched (docs/DEV-SETUP.md, "Quick rebuilds").
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
